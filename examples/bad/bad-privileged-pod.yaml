---
# Breaks nothing in the Kyverno policies on purpose: non-root, limits, pinned tag.
# Only Pod Security Admission refuses it (restricted and baseline both), because of privileged.
# No namespace here: the e2e script applies it to team-a and to legacy-apps.
apiVersion: v1
kind: Pod
metadata:
  name: bad-privileged-pod
spec:
  automountServiceAccountToken: false
  containers:
    - name: web
      image: nginxinc/nginx-unprivileged:1.30.6-alpine
      securityContext:
        privileged: true
        allowPrivilegeEscalation: true
        runAsNonRoot: true
        runAsUser: 10101
      resources:
        requests:
          cpu: 50m
          memory: 32Mi
        limits:
          memory: 64Mi
