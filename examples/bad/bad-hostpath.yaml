---
# Breaks disallow-hostpath only.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bad-hostpath
  namespace: team-a
  labels:
    app.kubernetes.io/name: bad-hostpath
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: bad-hostpath
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bad-hostpath
    spec:
      serviceAccountName: web
      automountServiceAccountToken: false
      # Preferred, not required: a one-node cluster (kind) must still start both replicas.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: bad-hostpath
      securityContext:
        runAsNonRoot: true
        runAsUser: 10101
        runAsGroup: 10101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: nginxinc/nginx-unprivileged:1.30.6-alpine
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
          volumeMounts:
            # nginx writes its pid file and temp dirs here; the rest of the
            # filesystem stays read-only.
            - name: tmp
              mountPath: /tmp
            - name: docker-sock
              mountPath: /var/run/docker.sock
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
        - name: docker-sock
          hostPath:
            path: /var/run/docker.sock
