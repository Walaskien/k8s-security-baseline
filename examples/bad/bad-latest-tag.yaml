---
# Breaks disallow-latest-tag. Everything else is the same as examples/good.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bad-latest-tag
  namespace: team-a
  labels:
    app.kubernetes.io/name: bad-latest-tag
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: bad-latest-tag
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bad-latest-tag
    spec:
      serviceAccountName: web
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: nginxinc/nginx-unprivileged:latest
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
          volumeMounts:
            # nginx writes its pid file and temp dirs here; the rest of the
            # filesystem stays read-only.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
