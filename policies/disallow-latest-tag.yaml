apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: disallow-latest-tag
  annotations:
    policies.kyverno.io/title: Disallow latest image tag
    policies.kyverno.io/severity: medium
    policies.kyverno.io/minversion: 1.19.0
    policies.kyverno.io/description: >-
      A mutable tag means the same manifest can run different code tomorrow and
      nobody can say which build is in the cluster. Require an explicit tag or a
      digest, and refuse ":latest".
spec:
  validationActions: [Deny]
  evaluation:
    background:
      enabled: true
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
      - apiGroups: [apps]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [deployments, statefulsets, daemonsets]
      - apiGroups: [batch]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [jobs, cronjobs]
    # System namespaces run host-level pods by design. kyverno is excluded so a
    # bad policy cannot block Kyverno's own restart.
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values: [kube-system, kube-public, kube-node-lease, kyverno]
  variables:
    - name: podSpec
      expression: >-
        object.kind == 'CronJob' ? object.spec.jobTemplate.spec.template.spec :
        (has(object.spec.template) ? object.spec.template.spec : object.spec)
    # initContainers run with the same privileges, so they get the same rules.
    - name: containers
      expression: >-
        variables.podSpec.containers + variables.podSpec.?initContainers.orValue([])
  validations:
    # Look only at the part after the last "/" so a registry port
    # (registry.local:5000/app) is not mistaken for a tag.
    - expression: >-
        variables.containers.all(c,
        c.image.substring(c.image.lastIndexOf('/') + 1).contains(':') ||
        c.image.contains('@'))
      message: "Every image needs an explicit tag or a digest."
    # The split drops a digest first, so "app:latest@sha256:..." is still caught.
    - expression: >-
        variables.containers.all(c, !c.image.split('@')[0].endsWith(':latest'))
      message: "The mutable image tag ':latest' is not allowed."
